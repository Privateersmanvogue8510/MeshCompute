syntax = "proto3";
package meshcompute.control.v1;

// Control-plane objects: registration, capability, catalog, scheduling, credits.
// Mirrors packages/protocol/meshcompute_protocol/{capability,manifest,session,
// receipts,api_models}.py. See proto/README.md.

message GpuInfo {
  string vendor = 1;            // nvidia|amd|apple|intel|cpu
  string model = 2;
  uint64 vram_bytes = 3;
  uint64 free_vram_bytes = 4;
  string compute_capability = 5;
  repeated string backend_support = 6;
}

message ContributionPolicy {
  bool idle_only = 1;
  uint32 max_gpu_percent = 2;
  uint32 max_vram_percent = 3;
  uint32 max_cpu_percent = 4;
  bool allow_public_pool = 5;
}

message BenchmarkResult {
  double decode_tokens_per_sec = 1;
  double prefill_tokens_per_sec = 2;
  string measured_model = 3;
  string measured_at = 4;
}

message CapabilityRecord {
  uint32 protocol_version = 1;
  string node_id = 2;
  string runtime_version = 3;
  string os = 4;
  string arch = 5;
  repeated GpuInfo gpus = 6;
  uint64 ram_free_bytes = 7;
  uint64 storage_share_bytes = 8;
  uint32 max_bandwidth_mbps = 9;
  repeated string backends = 10;
  repeated string strategies = 11;
  ContributionPolicy contribution_policy = 12;
  BenchmarkResult benchmark = 13;
  // internet-native reachability (no VPN)
  repeated string local_addrs = 14;
  string reflexive_addr = 15;
  string relay_addr = 16;
  string nat_type = 17;
  uint32 quic_port = 18;
}

message SignedCapability {
  CapabilityRecord record = 1;
  string public_b64 = 2;
  string signature_b64 = 3;
}

// Scheduling -----------------------------------------------------------------
enum Strategy {
  STRATEGY_UNSPECIFIED = 0;
  SINGLE = 1;
  PIPELINE = 2;
  TENSOR = 3;
  EXPERT = 4;
  SPECULATIVE = 5;
  REPLICA = 6;
}

message ShardAssignment {
  string node_id = 1;
  Strategy role = 2;
  optional uint32 layer_start = 3;
  optional uint32 layer_end = 4;
  string backend = 5;
  optional string addr = 6;
}

message ExecutionPlan {
  uint32 protocol_version = 1;
  string plan_id = 2;
  string model_manifest_hash = 3;
  string model_id = 4;
  Strategy strategy = 5;
  repeated string peer_chain = 6;
  repeated ShardAssignment shard_assignment = 7;
  uint32 context_length = 8;
  double predicted_ttft_s = 9;
  double predicted_decode_tps = 10;
  repeated string decision_trace = 11;     // WHY this plan (auditable)
  repeated string rejected_alternatives = 12;
}

message ScheduleRequest {
  uint32 protocol_version = 1;
  string model_id = 2;
  string pool_id = 3;
  string client_node_id = 4;
  uint32 context_length = 5;
  uint32 prompt_tokens = 6;
  uint32 gen_tokens = 7;
  int32 priority = 8;
  string user_id = 9;
}

// Work receipts / credits ----------------------------------------------------
message MeasuredWork {
  double gpu_active_ms = 1;
  uint32 layers_processed = 2;
  uint32 tokens_generated = 3;
  uint64 activation_bytes = 4;
  uint64 model_shard_bytes_served = 5;
  uint32 draft_tokens_accepted = 6;
}

message WorkReceipt {
  uint32 protocol_version = 1;
  string receipt_id = 2;
  string session_id = 3;
  string plan_id = 4;
  string node_id = 5;
  string model_manifest_hash = 6;
  string role = 7;
  MeasuredWork measured_work = 8;
  double started_at = 9;
  double finished_at = 10;
  string outcome = 11;            // ok|partial|failed|cancelled
  string challenge_nonce = 12;    // anti-replay
}

message SignedReceipt {
  WorkReceipt receipt = 1;
  string public_b64 = 2;
  string signature_b64 = 3;
}
