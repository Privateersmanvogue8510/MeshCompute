[project]
name = "meshcompute"
version = "0.1.0"
description = "Peer-to-peer distributed AI inference fabric — Phase 1 POC"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "mr-tbot" }]

# Internet-native from the start: no VPN / no tailnet. The data plane is QUIC
# (aioquic) with rendezvous-coordinated NAT hole-punching + relay fallback, and
# BitTorrent-style content-addressed model distribution. torch/vLLM/sglang are
# NOT Phase-1 deps: the inference backend is llama.cpp / an OpenAI-compatible
# endpoint, which slot in behind stable interfaces.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",        # Ed25519 node identity + manifest signing + QUIC TLS
    "blake3>=0.4",             # content addressing
    "aioquic>=1.0",            # QUIC data plane (encrypted, multiplexed, over UDP)
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "respx>=0.21"]

[project.scripts]
mesh = "meshcompute_cli.main:cli"

[tool.setuptools.packages.find]
where = ["packages/protocol", "apps/control-plane", "apps/gateway", "apps/cli", "node/daemon", "node/runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages/protocol", "apps/control-plane", "apps/gateway", "apps/cli", "node/daemon", "node/runtime"]

[tool.ruff]
line-length = 100
target-version = "py312"
